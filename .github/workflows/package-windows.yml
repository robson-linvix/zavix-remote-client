# ZAVIX Windows V1: validate the actual compiled EXE without changing its bytes.
name: Package ZAVIX Windows
permissions:
  contents: read
  actions: read
jobs:
  package:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
    - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      with:
        submodules: recursive
        fetch-depth: 0
    - name: Verify build provenance and packaging changes
      env:
        GH_TOKEN: ${{ github.token }}
        BUILD_RUN: ${{ inputs.build_run }}
        BUILD_REVISION: ${{ inputs.build_revision }}
      shell: bash
      run: 'gh api "repos/${{ github.repository }}/actions/runs/$BUILD_RUN" > build-provenance.json

        python -c ''import json,os,re; b=json.load(open("build-provenance.json")); assert b["head_sha"]==os.environ["BUILD_REVISION"]
        and b["conclusion"]=="success" and b["head_branch"]=="main" and b["event"]=="workflow_dispatch"; assert re.fullmatch("[0-9a-f]{40}",b["head_sha"])''

        git diff --name-only "$BUILD_REVISION" HEAD > packaging-changes.txt

        python -c ''from pathlib import Path; paths=Path("packaging-changes.txt").read_text().splitlines(); assert all(p.startswith(("scripts/",
        ".github/workflows/", "branding/WindowInjection-")) or p in ("THIRD-PARTY-LICENSES.md", "README.md", "README-RUSTDESK.md",
        "BUILD-ZAVIX.md") for p in paths), paths''

        '
    - name: Download compiled EXE and corresponding sources
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      with:
        name: zavix-windows-x64-unsigned
        path: SignOutput
        run-id: ${{ inputs.build_run }}
        github-token: ${{ github.token }}
    - name: Verify original package hashes and source revision
      env:
        BUILD_REVISION: ${{ inputs.build_revision }}
      run: 'python -c ''import json,os,hashlib; from pathlib import Path; r=Path("SignOutput"); m=json.loads((r/"manifest.json").read_text());
        assert m["revision"]==os.environ["BUILD_REVISION"] and m["signed"] is False and len(m["files"])==2; assert all((r/f["name"]).stat().st_size==f["bytes"]
        and hashlib.sha256((r/f["name"]).read_bytes()).hexdigest()==f["sha256"] for f in m["files"])''

        if ($LASTEXITCODE -ne 0) { throw ''Original package verification failed'' }'
    - name: Test final portable executable
      run: './scripts/test_portable.ps1 -Executable ./SignOutput/ZAVIXRemote-1.5.0.1.exe

        Copy-Item build-provenance.json SignOutput/'
    - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: zavix-windows-release
        path: SignOutput/
        if-no-files-found: error
        retention-days: 30
'on':
  workflow_dispatch:
    inputs:
      build_run:
        description: Successful Windows build run
        required: true
        type: string
      build_revision:
        description: SHA of the compiled client
        required: true
        type: string
