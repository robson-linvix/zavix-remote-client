name: ZAVIX Remote Linux x64
on:
  workflow_dispatch:
  push:
    branches: [codex/linux-client-x64]
    paths:
      - '.github/workflows/linux-client.yml'
      - 'scripts/*linux.py'
      - 'src/zavix_linux.rs'
      - 'branding/linux.json'
permissions:
  contents: read
  actions: read
concurrency:
  group: zavix-linux-client-${{ github.ref }}
  cancel-in-progress: false
jobs:
  bridge:
    uses: ./.github/workflows/bridge.yml
  linux:
    needs: bridge
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          submodules: recursive
      - name: Build and graphical validation dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libclang-dev llvm-dev ninja-build cmake pkg-config libgtk-3-dev libayatana-appindicator3-dev libasound2-dev libpulse-dev libxdo-dev libxfixes-dev libxcb-randr0-dev libxcb-shape0-dev libxcb-xfixes0-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev libssl-dev libdbus-1-dev libopus-dev libvpx-dev libyuv-dev libaom-dev libva-dev nasm xvfb xdotool imagemagick dbus-x11
          mkdir -p /tmp/zavix-pkgconfig
          printf 'prefix=/usr\nlibdir=/usr/lib/x86_64-linux-gnu\nincludedir=/usr/include\nName: libyuv\nDescription: system libyuv\nVersion: 1\nLibs: -L${libdir} -lyuv\nCflags: -I${includedir}\n' > /tmp/zavix-pkgconfig/libyuv.pc
          echo 'PKG_CONFIG_PATH=/tmp/zavix-pkgconfig' >> "$GITHUB_ENV"
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          channel: stable
          flutter-version: '3.24.5'
          cache: true
      - name: Existing Flutter compatibility patch
        run: |
          cd "$(dirname "$(dirname "$(command -v flutter)")")"
          git apply "$GITHUB_WORKSPACE/.github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff"
      - uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
        with:
          toolchain: '1.75'
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
        with:
          prefix-key: zavix-linux-client-ubuntu22
          cache-on-failure: true
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: bridge-artifact
          path: ./
      - name: Prepare Linux identity
        run: python3 scripts/prepare_linux.py
      - name: Native Linux client
        run: cargo build --locked --lib --features flutter,linux-pkg-config,zavix-linux --release
      - name: Flutter Linux client
        working-directory: flutter
        run: |
          flutter pub get
          flutter build linux --release
      - name: Package native client and corresponding source
        run: |
          cp -L /usr/lib/x86_64-linux-gnu/libyuv.so.0 flutter/build/linux/x64/release/bundle/lib/
          cp -L /usr/lib/x86_64-linux-gnu/libjpeg.so.8 flutter/build/linux/x64/release/bundle/lib/
          python3 scripts/package_linux.py
      - name: Validate package lifecycle, configuration and GUI
        run: xvfb-run -a -s '-screen 0 1280x800x24' dbus-run-session -- python3 scripts/test_linux.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: zavix-linux-x64-candidate
          path: LinuxRelease/
          if-no-files-found: error
          retention-days: 30
      - name: Keep failure diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: zavix-linux-failure-diagnostics
          path: |
            LinuxRelease/linux-gui.log
            LinuxRelease/linux-gui.png
          if-no-files-found: ignore
